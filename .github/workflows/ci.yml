name: CI

on:
  push:
    branches:
      - main
  pull_request:

# Ordinary CI is intentionally web-first and Linux-only.
# Desktop/platform packaging stays local or explicitly manual until it is a real release target.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-ci:
    name: Web CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Baseline checks
        run: pnpm check

      - name: Build website
        run: pnpm --filter @pi-gui/website run build
